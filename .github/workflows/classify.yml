name: Classify issue

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: classify-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the issue type from the form's Kind
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          kind=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^### Kind$/{getline; getline; print; exit}')
          if [ -z "$kind" ]; then
            echo "No Kind section; leaving the issue unclassified." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Record what GITHUB_TOKEN can see; the PATCH below is attempted either way.
          gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){issueTypes(first:50){nodes{name isEnabled}}}}' \
            -f o="${REPO%/*}" -f n="${REPO#*/}" > types.json 2>&1 || true
          echo "issueTypes as seen by GITHUB_TOKEN:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat types.json | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          gh api -X PATCH "repos/$REPO/issues/$NUMBER" -f type="$kind" \
            --jq '"Issue #\(.number) type set to \(.type.name) with GITHUB_TOKEN."' | tee -a "$GITHUB_STEP_SUMMARY"
